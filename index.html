<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>XPBD Fracture Sim — M5</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e14; color: #e6edf6; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    #hud { position: fixed; top: 0; left: 0; right: 0; padding: 10px 12px; background: linear-gradient(rgba(11,14,20,.92), transparent); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; }
    #hud label { display: flex; align-items: center; gap: 6px; }
    #hud input[type=range] { width: 110px; accent-color: #6cb8ff; }
    #hud button { background: #1b2636; color: inherit; border: 1px solid #33465f; border-radius: 8px; padding: 6px 12px; }
    #hud .val { min-width: 4.6em; color: #9fd0ff; font-variant-numeric: tabular-nums; }
    #hud .val i { font-style: normal; font-weight: 400; opacity: .65; }
    #info { opacity: .7; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <label>Мягкость <input id="soft" type="range" min="0" max="100" value="40"> <b class="val" id="v-soft"></b></label>
    <label>Гравитация <input id="grav" type="range" min="0" max="2000" value="900"> <b class="val" id="v-grav"></b></label>
    <label><input id="fem" type="checkbox" checked> FEM (M3)</label>
    <label>Жёсткость E <input id="young" type="range" min="0" max="100" value="25"> <b class="val" id="v-young"></b></label>
    <label>ν <input id="nu" type="range" min="0" max="45" value="30"> <b class="val" id="v-nu"></b></label>
    <label><input id="area" type="checkbox" checked> Площадь (только M2)</label>
    <label>Мягкость площади <input id="softA" type="range" min="0" max="100" value="40"> <b class="val" id="v-softA"></b></label>
    <label><input id="pin" type="checkbox"> Закрепить левый край</label>
    <label><input id="tear" type="checkbox"> Рвать</label>
    <label><input id="cut" type="checkbox" checked> Трещины (M4)</label>
    <label><input id="collide" type="checkbox" checked> Столкновения кусков (M5)</label>
    <button id="knife">✂ Нож: выкл</button>
    <label>Подшаги <input id="sub" type="range" min="4" max="30" value="10"> <b class="val" id="v-sub"></b></label>
    <label><input id="adapt" type="checkbox"> Авто-подшаги</label>
    <label>Детализация <input id="detail" type="range" min="1" max="12" value="1"> <b class="val" id="v-detail"></b></label>
    <label>Порог разрыва <input id="tearAt" type="range" min="10" max="150" value="45"> <b class="val" id="v-tearAt"></b></label>
    <label>Ядро <select id="backend"><option value="js">JS</option><option value="scalar">WASM</option><option value="simd">WASM SIMD</option></select></label>
    <button id="reset">Сброс</button>
    <span id="info"></span>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
