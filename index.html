<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>XPBD Fracture Sim — M1</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e14; color: #e6edf6; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
    canvas { display: block; touch-action: none; }
    #hud { position: fixed; top: 0; left: 0; right: 0; padding: 10px 12px; background: linear-gradient(rgba(11,14,20,.92), transparent); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; }
    #hud label { display: flex; align-items: center; gap: 6px; }
    #hud input[type=range] { width: 110px; accent-color: #6cb8ff; }
    #hud button { background: #1b2636; color: inherit; border: 1px solid #33465f; border-radius: 8px; padding: 6px 12px; }
    #info { opacity: .7; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <label>Мягкость <input id="soft" type="range" min="0" max="100" value="40"></label>
    <label>Гравитация <input id="grav" type="range" min="0" max="2000" value="900"></label>
    <label><input id="pin" type="checkbox"> Закрепить левый край</label>
    <label><input id="tear" type="checkbox"> Рвать рёбра</label>
    <label>Порог разрыва <input id="tearAt" type="range" min="10" max="150" value="45"></label>
    <button id="reset">Сброс</button>
    <span id="info"></span>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
