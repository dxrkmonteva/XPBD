<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>XPBD Fracture Sim — 3D</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0e14; color: #e6edf6; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; top: 0; left: 0; right: 0; padding: 10px 12px; background: linear-gradient(rgba(11,14,20,.92), transparent); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    #hud label { display: flex; align-items: center; gap: 6px; }
    #hud input[type=range] { width: 110px; accent-color: #6cb8ff; }
    #hud button, #hud a.btn { background: #1b2636; color: inherit; border: 1px solid #33465f; border-radius: 8px; padding: 6px 12px; text-decoration: none; font-size: 13px; }
    #hud .val { min-width: 4.6em; color: #9fd0ff; font-variant-numeric: tabular-nums; }
    #info { opacity: .7; font-variant-numeric: tabular-nums; width: 100%; }
    #err { position: fixed; inset: 40% 10% auto; text-align: center; color: #ff9b9b; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <a class="btn" href="./index.html">← 2D</a>
    <label>Жёсткость E <input id="young" type="range" min="0" max="100" value="45"> <b class="val" id="v-young"></b></label>
    <label>ν <input id="nu" type="range" min="0" max="45" value="30"> <b class="val" id="v-nu"></b></label>
    <label>Гравитация <input id="grav" type="range" min="0" max="20" step="0.1" value="9.81"> <b class="val" id="v-grav"></b></label>
    <label>Подшаги <input id="sub" type="range" min="2" max="40" value="10"> <b class="val" id="v-sub"></b></label>
    <label>Трение <input id="fric" type="range" min="0" max="100" value="60"> <b class="val" id="v-fric"></b></label>
    <label>Ядро <select id="backend"><option value="js">JS</option><option value="scalar">WASM</option><option value="simd" selected>WASM SIMD</option></select></label>
    <label>Детализация <input id="detail" type="range" min="1" max="6" value="2"> <b class="val" id="v-detail"></b></label>
    <label><input id="pin" type="checkbox"> Закрепить левую грань</label>
    <label><input id="colorize" type="checkbox" checked> Показать деформацию</label>
    <button id="reset">Сброс</button>
    <div id="info"></div>
  </div>
  <div id="err"></div>
  <script type="module" src="/src/main3d.js"></script>
</body>
</html>
